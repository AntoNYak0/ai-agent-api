name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint (fail-fast, runs first) ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check app/ --ignore=E501,F841

  # ── Security scan (advisory — won't block CI) ────────────────────────
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt bandit pip-audit
      - name: Bandit SAST
        run: bandit -r app/ -ll --skip B101,B104
      - name: pip-audit dependency scan
        run: pip-audit

  # ── Tests ────────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage

      - name: Test with pytest + coverage
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACILITATOR_MODE: direct
          TESTNET: true
        run: |
          coverage run -m pytest tests/ -v
          coverage report --show-missing --fail-under=60

  # ── Integration tests (spin up server, run against it) ──────────────
  integration:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Start server
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACILITATOR_MODE: direct
          TESTNET: true
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start after 30s"
          exit 1

      - name: Run integration tests
        run: python scripts/integration_test.py --base-url http://127.0.0.1:8000

      - name: Stop server
        if: always()
        run: kill $(lsof -t -i:8000) 2>/dev/null || true
