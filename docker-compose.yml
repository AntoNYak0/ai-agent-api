services:
  app:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - agent_data:/opt/agent-api/data
      - agent_logs:/opt/agent-api/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agent_data:
  agent_logs:
