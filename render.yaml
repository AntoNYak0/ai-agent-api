services:
  - type: web
    name: ai-agent-api
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PAY_TO_ADDRESS_EVM
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: TESTNET
        value: "false"
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator

  - type: cron
    name: anti-sleep-ping
    env: python
    region: frankfurt
    schedule: "*/7 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import requests; r = requests.get('https://ai-agent-api.onrender.com/health'); print(r.status_code, r.text)"
